name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payflow_test
          POSTGRES_USER: payflow
          POSTGRES_PASSWORD: payflow_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Lint Code
        run: npm run lint
        continue-on-error: true  # Don't fail build on lint warnings

      - name: Run Tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://payflow:payflow_secret@localhost:5432/payflow_test
          TEST_DATABASE_URL: postgresql://payflow:payflow_secret@localhost:5432/payflow_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_jwt_secret_key_12345_for_testing_only
          PORT: 4000
          LOG_LEVEL: silent
        run: npm test

      - name: Generate Coverage Report
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://payflow:payflow_secret@localhost:5432/payflow_test
          TEST_DATABASE_URL: postgresql://payflow:payflow_secret@localhost:5432/payflow_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_jwt_secret_key_12345_for_testing_only
          PORT: 4000
          LOG_LEVEL: silent
        run: npm run test:coverage

      - name: Build TypeScript Output
        run: npm run build

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check & Build
        env:
          VITE_API_URL: http://localhost:4000/api
        run: npm run build
